<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmLink | Direct Agricultural Marketplace</title>
    <style>
        :root {
            --primary-green: #2e7d32;
            --dark-green: #1b5e20;
            --accent-orange: #f57c00;
            --bg-light: #f4f6f5;
            --text-main: #333333;
            --text-muted: #666666;
            --white: #ffffff;
            --border-color: #dddddd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* Header & Navigation */
        header {
            background-color: var(--white);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-green);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-controls {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .role-switch-container {
            display: flex;
            background: var(--bg-light);
            border-radius: 20px;
            padding: 3px;
        }

        .role-btn {
            background: transparent;
            border: none;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 17px;
            transition: all 0.3s ease;
            color: var(--text-muted);
        }

        .role-btn.active {
            background: var(--primary-green);
            color: var(--white);
        }

        /* Main Layout Container */
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Dashboard Views */
        .dashboard-view {
            display: none;
        }

        .dashboard-view.active {
            display: block;
        }

        /* Buyer Marketplace Styles */
        .marketplace-header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .marketplace-header h1 {
            color: var(--dark-green);
            margin-bottom: 0.5rem;
        }

        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
        }

        .category-filters {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .cat-chip {
            background: var(--white);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .cat-chip:hover, .cat-chip.active {
            background: var(--primary-green);
            color: var(--white);
            border-color: var(--primary-green);
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: var(--white);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
        }

        .product-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #e0e0e0;
        }

        .product-body {
            padding: 1.25rem;
        }

        .product-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent-orange);
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .product-price {
            font-size: 1.2rem;
            color: var(--primary-green);
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .product-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
        }

        .btn-primary {
            background: var(--primary-green);
            color: var(--white);
            border: none;
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: var(--dark-green);
        }

        /* Farmer Dashboard Styles */
        .farmer-dashboard {
            background: var(--white);
            padding: 2rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .dashboard-banner {
            background: #e8f5e9;
            border-left: 4px solid var(--primary-green);
            padding: 1rem;
            margin-bottom: 2rem;
            border-radius: 0 6px 6px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .verification-badge {
            background: var(--accent-orange);
            color: var(--white);
            padding: 4px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
            font-weight: 600;
        }

        .verification-badge.verified {
            background: var(--primary-green);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select {
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
        }

        /* Checkout Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-card {
            background: var(--white);
            width: 100%;
            max-width: 450px;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                gap: 1rem;
            }
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="nav-container">
            <a href="#" class="logo">🌱 FarmLink</a>
            <div class="nav-controls">
                <div class="role-switch-container">
                    <button class="role-btn active" onclick="switchRole('buyer')">Buyer View</button>
                    <button class="role-btn" onclick="switchRole('farmer')">Farmer Dashboard</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <!-- BUYER MARKETPLACE VIEW -->
        <section id="buyerView" class="dashboard-view active">
            <div class="marketplace-header">
                <h1>Fresh Produce Direct From Local Farms</h1>
                <p>Order fresh fruits, vegetables, and grains directly from verified agricultural producers.</p>
            </div>

            <div class="filter-bar">
                <input type="text" class="search-input" id="searchInput" placeholder="Search produce (e.g., tomatoes, plantain, maize)..." oninput="filterProducts()">
                <div class="category-filters">
                    <button class="cat-chip active" onclick="filterCategory('all', this)">All Produce</button>
                    <button class="cat-chip" onclick="filterCategory('Fruits', this)">Fruits</button>
                    <button class="cat-chip" onclick="filterCategory('Vegetables', this)">Vegetables</button>
                    <button class="cat-chip" onclick="filterCategory('Grains', this)">Grains</button>
                </div>
            </div>

            <div class="product-grid" id="productGrid">
                <!-- Product cards dynamically loaded via JS -->
            </div>
        </section>

        <!-- FARMER LISTING DASHBOARD VIEW -->
        <section id="farmerView" class="dashboard-view">
            <div class="farmer-dashboard">
                <div class="dashboard-banner">
                    <div>
                        <h3>Farmer Product Listing & Inventory</h3>
                        <p style="font-size: 0.85rem; color: var(--text-muted);">Manage your active catalog and live stock quantities.</p>
                    </div>
                    <span class="verification-badge verified" id="verStatusBadge">✔ Verified Farmer</span>
                </div>

                <h4 style="margin-bottom: 1rem; color: var(--dark-green);">Add New Produce Listing</h4>
                <form id="addProduceForm" onsubmit="handleAddNewProduct(event)">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Produce Name</label>
                            <input type="text" id="prodName" required placeholder="e.g., Fresh Organic Tomatoes">
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <select id="prodCategory" required>
                                <option value="Vegetables">Vegetables</option>
                                <option value="Fruits">Fruits</option>
                                <option value="Grains">Grains</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Price (per unit)</label>
                            <input type="number" id="prodPrice" step="0.01" required placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label>Available Quantity (e.g., crates/kg)</label>
                            <input type="text" id="prodQty" required placeholder="e.g., 50 Crates">
                        </div>
                        <div class="form-group">
                            <label>Location / Town</label>
                            <input type="text" id="prodLocation" required placeholder="e.g., Techiman Market">
                        </div>
                        <div class="form-group">
                            <label>Image URL (Optional)</label>
                            <input type="url" id="prodImg" placeholder="https://example.com/image.jpg">
                        </div>
                    </div>
                    <button type="submit" class="btn-primary" style="max-width: 250px;">Publish Listing</button>
                </form>
            </div>
        </section>
    </main>

    <!-- CHECKOUT / ORDER MODAL -->
    <div class="modal-overlay" id="checkoutModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalProductTitle">Secure Checkout</h3>
                <button class="close-btn" onclick="closeCheckout()">✕</button>
            </div>
            <p id="modalProductDetails" style="margin-bottom: 1rem; color: var(--text-muted); font-size: 0.9rem;"></p>
            <form onsubmit="handleCheckoutSubmit(event)">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label>Your Full Name</label>
                    <input type="text" required placeholder=" Samadu Ibrahim">
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label>Delivery Contact Number</label>
                    <input type="tel" required placeholder="+233 24 000 0000">
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label>Payment Method</label>
                    <select required>
                        <option value="momo">Mobile Money (MTN / Telecel / AirtelTigo)</option>
                        <option value="card">Bank Card (Visa / Mastercard)</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Complete Secure Payment</button>
            </form>
        </div>
    </div>

   <script>
        // Live Backend API Base URL
        const API_URL = 'https://farmlink-backend-exmq.onrender.com';

        let products = [];
        let currentCategoryFilter = 'all';

        // Role Switching Logic
        function switchRole(role) {
            const buttons = document.querySelectorAll('.role-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            if (role === 'buyer') {
                buttons[0].classList.add('active');
                document.getElementById('buyerView').classList.add('active');
                document.getElementById('farmerView').classList.remove('active');
                fetchProducts();
            } else {
                buttons[1].classList.add('active');
                document.getElementById('farmerView').classList.add('active');
                document.getElementById('buyerView').classList.remove('active');
            }
        }

        // Fetch Products Live from Backend API
        async function fetchProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 3rem;">Loading produce from server...</p>`;
            
            try {
                const response = await fetch(`${API_URL}/api/products`);
                products = await response.json();
                filterProducts();
            } catch (error) {
                console.error('Error fetching products:', error);
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: red; padding: 3rem;">Unable to connect to live server.</p>`;
            }
        }

        // Render Marketplace Products
        function renderProducts(list = products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            if (list.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 3rem;">No produce found matching your criteria.</p>`;
                return;
            }

            list.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${p.image || 'https://images.unsplash.com/photo-1488459716790-a3db5ea8d3ac?auto=format&fit=crop&w=600&q=80'}" alt="${p.title}" class="product-img">
                    <div class="product-body">
                        <div class="product-category">${p.category}</div>
                        <div class="product-title">${p.title}</div>
                        <div class="product-price">GHC ${p.price}</div>
                        <div class="product-meta">
                            <span>Stock: ${p.quantity}</span>
                            <span>📍 ${p.location}</span>
                        </div>
                        <button class="btn-primary" onclick="openCheckout('${p.title}', '${p.price}')">Order Now</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Category Filtering
        function filterCategory(category, element) {
            currentCategoryFilter = category;
            document.querySelectorAll('.cat-chip').forEach(chip => chip.classList.remove('active'));
            element.classList.add('active');
            filterProducts();
        }

        // Search and Filter Combination
        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => {
                const matchesCategory = currentCategoryFilter === 'all' || p.category === currentCategoryFilter;
                const matchesSearch = p.title.toLowerCase().includes(query) || p.location.toLowerCase().includes(query);
                return matchesCategory && matchesSearch;
            });
            renderProducts(filtered);
        }

        // Handle New Product Submission to Live Backend
        async function handleAddNewProduct(event) {
            event.preventDefault();

            const newProduct = {
                title: document.getElementById('prodName').value,
                category: document.getElementById('prodCategory').value,
                price: parseFloat(document.getElementById('prodPrice').value).toFixed(2),
                quantity: document.getElementById('prodQty').value,
                location: document.getElementById('prodLocation').value,
                image: document.getElementById('prodImg').value.trim() !== '' ? document.getElementById('prodImg').value : undefined
            };

            try {
                const response = await fetch(`${API_URL}/api/products`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newProduct)
                });

                if (response.ok) {
                    alert('Produce listed successfully and published to the live marketplace!');
                    document.getElementById('addProduceForm').reset();
                    switchRole('buyer');
                } else {
                    alert('Failed to publish listing. Please try again.');
                }
            } catch (error) {
                console.error('Error publishing product:', error);
                alert('Server error while saving listing.');
            }
        }

        // Checkout Modal Functions
        function openCheckout(title, price) {
            document.getElementById('modalProductTitle').innerText = `Order: ${title}`;
            document.getElementById('modalProductDetails').innerText = `Total Amount: GHC ${price} (Includes secure escrow protection).`;
            document.getElementById('checkoutModal').classList.add('open');
        }

        function closeCheckout() {
            document.getElementById('checkoutModal').classList.remove('open');
        }

        function handleCheckoutSubmit(event) {
            event.preventDefault();
            alert('Payment initiated successfully via integrated gateway! Order confirmed.');
            closeCheckout();
        }

        // Initial load from live backend
        fetchProducts();
    </script>
</body>
</html>
